[package]
name = "origo-backend"
version = "1.0.0"
edition = "2021"
description = "Backend API REST de alto rendimiento en Rust (Axum + SQLite/PostgreSQL-ready) para Origo (CREATIC Casanare)"

[lib]
name = "origo_backend"
path = "src/lib.rs"

[[bin]]
name = "origo-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
unicode-normalization = "0.1"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
